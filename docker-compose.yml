# Local development stack: PostgreSQL with pgvector, Redis, and the API.
#
#   docker compose up -d
#   docker compose run --rm api civicos db upgrade
#   docker compose run --rm api civicos db seed
#
# Then: http://localhost:8000/docs  (send header X-Tenant: demo)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: civicos
      POSTGRES_PASSWORD: civicos
      POSTGRES_DB: civicos
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./deploy/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicos -d civicos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      CIVICOS_ENVIRONMENT: local
      CIVICOS_DEBUG: "true"
      CIVICOS_OBSERVABILITY__LOG_FORMAT: console
      CIVICOS_DATABASE__URL: postgresql+asyncpg://civicos:civicos@db:5432/civicos
      CIVICOS_REDIS__URL: redis://redis:6379/0
      CIVICOS_SECURITY__SECRET_KEY: local-development-secret-key-not-for-production
      CIVICOS_CORS__ALLOW_ORIGINS: http://localhost:3000,http://localhost:5173
      CIVICOS_TENANCY__DEFAULT_TENANT_SLUG: demo
      # Set a real provider and key to enable model-backed features.
      CIVICOS_AI__PROVIDER: ${CIVICOS_AI__PROVIDER:-mock}
      CIVICOS_AI__ANTHROPIC_API_KEY: ${CIVICOS_AI__ANTHROPIC_API_KEY:-}
      CIVICOS_AI__GOOGLE_API_KEY: ${CIVICOS_AI__GOOGLE_API_KEY:-}
      CIVICOS_AI__OPENAI_API_KEY: ${CIVICOS_AI__OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/var/uploads

  # Scheduled jobs: SLA sweep, escalation, notification retries, rollups.
  worker:
    build:
      context: .
      target: runtime
    depends_on:
      api:
        condition: service_started
    environment:
      CIVICOS_DATABASE__URL: postgresql+asyncpg://civicos:civicos@db:5432/civicos
      CIVICOS_REDIS__URL: redis://redis:6379/0
      CIVICOS_SECURITY__SECRET_KEY: local-development-secret-key-not-for-production
      CIVICOS_OBSERVABILITY__LOG_FORMAT: console
    volumes:
      - uploads:/app/var/uploads
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          civicos ops sla-sweep || true
          civicos ops retry-notifications || true
          sleep 300
        done

volumes:
  db_data:
  redis_data:
  uploads:
